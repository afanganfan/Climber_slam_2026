    - nav2_is_battery_charging_condition_bt_node

# ========================
# BT导航器 RCL CPP 节点配置
# ========================
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false                          # 是否使用仿真时间

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false                          # 是否使用仿真时间
# ========================
# 控制器服务器 (局部路径跟踪) 配置
# 用于计算速度命令跟踪全局路径
# ========================
controller_server:
  ros__parameters:
    use_sim_time: true                           # 是否使用仿真时间
    controller_frequency: 20.0                   # 控制器运行频率 (Hz)
    min_x_velocity_threshold: 0.001              # X方向最小速度阈值 (m/s)
    min_y_velocity_threshold: 0.001              # Y方向最小速度阈值 (m/s)
    min_theta_velocity_threshold: 0.001          # 角速度最小阈值 (rad/s)
    failure_tolerance: 0.5                       # 失败容差
    progress_checker_plugin: progress_checker    # 进度检查插件名称
    goal_checker_plugins:                        # 目标检查插件列表
    - general_goal_checker
    controller_plugins:                          # 路径跟踪控制器插件
    - FollowPath

    # ========================
    # 进度检查器参数
    # 检测机器人是否在向目标移动
    # ========================
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2              # 需要的移动半径 (m)
      movement_time_allowance: 6.0               # 允许的移动时间 (s)

    # ========================
    # 目标检查器参数
    # 检测是否到达目标位置
    # ========================
    general_goal_checker:
      stateful: true                             # 是否保存状态
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25                    # XY平面目标容差 (m)
      yaw_goal_tolerance: 0.8                    # 偏航角目标容差 (rad)
    
    # ========================
    # DWB (动态窗口法) 局部路径规划器参数
    # 用于实时路径跟踪和碰撞避免
    # ========================
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: true             # 是否输出轨迹调试信息
      min_vel_x: -2.0                            # X方向最小速度 (m/s)
      min_vel_y: -2.0                            # Y方向最小速度 (m/s)
      max_vel_x: 2.0                             # X方向最大速度 (m/s)
      max_vel_y: 2.0                             # Y方向最大速度 (m/s)
      max_vel_theta: 0.0                         # 最大角速度 (rad/s)
      min_speed_xy: -3.0                         # XY最小速度 (m/s)
      max_speed_xy: 1.0                          # XY最大速度 (m/s)
      min_speed_theta: 0.0                       # 最小角速度 (rad/s)
      acc_lim_x: 2.0                             # X方向最大加速度 (m/s²)
      acc_lim_y: 2.0                             # Y方向最大加速度 (m/s²)
      acc_lim_theta: 3.2                         # 最大角加速度 (rad/s²)
      decel_lim_x: -2.0                          # X方向最大减速度 (m/s²)
      decel_lim_y: -2.0                          # Y方向最大减速度 (m/s²)
      decel_lim_theta: -3.2                      # 最大角减速度 (rad/s²)
      vx_samples: 20                             # X方向速度采样点数
      vy_samples: 20                             # Y方向速度采样点数
      vtheta_samples: 5                          # 角速度采样点数
      sim_time: 1.7                              # 轨迹模拟时长 (s)
      linear_granularity: 0.05                   # 线性采样粒度 (m)
      angular_granularity: 0.025                 # 角度采样粒度 (rad)
      transform_tolerance: 0.2                   # 变换容差 (s)
      xy_goal_tolerance: 0.25                    # XY目标容差 (m)
      trans_stopped_velocity: 0.25               # 停止平移的速度阈值 (m/s)
      short_circuit_trajectory_evaluation: true  # 是否短路轨迹评估
      stateful: true                             # 是否保存状态
      critics:                                   # 评价函数列表
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      BaseObstacle.scale: 0.02                   # 基础障碍物评价函数权重
      PathAlign.scale: 32.0                      # 路径对齐评价函数权重
      PathAlign.forward_point_distance: 0.1      # 前瞻距离 (m)
      GoalAlign.scale: 24.0                      # 目标对齐评价函数权重
      GoalAlign.forward_point_distance: 0.1      # 前瞻距离 (m)
      PathDist.scale: 32.0                       # 路径距离评价函数权重
      GoalDist.scale: 24.0                       # 目标距离评价函数权重
      RotateToGoal.scale: 32.0                   # 旋转至目标评价函数权重
      RotateToGoal.slowing_factor: 5.0           # 旋转减速因子
      RotateToGoal.lookahead_time: -1.0          # 前瞻时间 (-1 表示使用默认值)
      shrink_horizon_backup: true                # 是否收缩地平线备份
      shrink_horizon_min_duration: 10.0          # 收缩地平线最小持续时间 (s)
      oscillation_recovery: true                 # 是否启用振荡恢复
      oscillation_v_eps: 0.1                     # 振荡速度阈值 (m/s)
      oscillation_omega_eps: 0.1                 # 振荡角速度阈值 (rad/s)
      oscillation_recovery_min_duration: 10.0    # 振荡恢复最小持续时间 (s)
      oscillation_filter_duration: 10.0          # 振荡过滤持续时间 (s)
# ========================
# 本地代价地图 (Local Costmap) 配置
# 用于机器人周围的局部障碍物映射
# ========================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0                     # 代价地图更新频率 (Hz)
      publish_frequency: 1.0                     # 代价地图发布频率 (Hz)
      global_frame: odom                         # 全局参考坐标系
      robot_base_frame: base_link                # 机器人基座坐标系
      use_sim_time: false                        # 是否使用仿真时间
      rolling_window: true                       # 是否使用滚动窗口
      width: 3                                   # 代价地图宽度 (m)
      height: 3                                  # 代价地图高度 (m)
      resolution: 0.05                           # 代价地图分辨率 (m/cell)
      robot_radius: 0.45                         # 机器人半径 (m)
      plugins:                                   # 图层插件列表
      - inflation_layer
      - obstacle_layer
      - static_layer
      
      # ========================
      # 膨胀层 - 在障碍物周围创建缓冲区
      # ========================
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0                 # 成本缩放因子
        inflation_radius: 0.75                   # 膨胀半径 (m)
        enabled: true                            # 是否启用
      
      # ========================
      # 障碍物层 - 处理传感器数据
      # ========================
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true                            # 是否启用
        observation_sources: rplidar livox       # 观测数据源
        max_obstacle_height: 1.0                 # 最大障碍物高度 (m)
        min_obstacle_height: -1.0                # 最小障碍物高度 (m)
        # rplidar:
        #   topic: /rplidar/scan
        #   max_obstacle_height: 1.0
        #   min_obstacle_height: -1.0
        #   clearing: true
        #   marking: true
        #   data_type: LaserScan
        #   raytrace_max_range: 3.0
        #   raytrace_min_range: 0.0
        #   obstacle_max_range: 2.5
        #   obstacle_min_range: 0.0
        # livox:
        #   topic: /scan
        #   max_obstacle_height: 1.0
        #   min_obstacle_height: -1.0
        #   clearing: true
        #   marking: true
        #   data_type: LaserScan
        #   raytrace_max_range: 3.0
        #   raytrace_min_range: 1.8
        #   obstacle_max_range: 2.5
        #   obstacle_min_range: 0.0
        scan:
          topic: /scan                           # 激光扫描话题
          data_type: LaserScan                   # 数据类型
          inf_is_valid: true                     # inf是否有效
          marking: true                          # 是否标记障碍物
          clearing: true                         # 是否清除自由空间
          obstacle_range: 8.0                    # 障碍物检测范围 (m)
          obstacle_min_range: 0.8                # 障碍物最小检测范围 (m)
          raytrace_max_range: 3.0                # 射线追踪最大范围 (m)
          raytrace_min_range: 1.8                # 射线追踪最小范围 (m)
          min_obstacle_height: 0.0               # 最小障碍物高度 (m)
          max_obstacle_height: 2.0               # 最大障碍物高度 (m)
      
      # ========================
      # 静态层 - 加载静态地图
      # ========================
      static_layer:
        map_subscribe_transient_local: true      # 订阅本地持久化地图
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true                            # 是否启用
        subscribe_to_updates: true               # 是否订阅更新
        map_topic: /map                          # 地图话题
        trinary_costmap: true                    # 三元代价地图
        lethal_cost_threshold: 50                # 致命成本阈值
      
      always_send_full_costmap: true             # 总是发送完整代价地图
      track_unknown_space: true                  # 是否追踪未知空间
# ========================
# 全局代价地图 (Global Costmap) 配置
# 用于整个环境的障碍物映射，包含静态地图
# ========================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0                      # 代价地图更新频率 (Hz)
      publish_frequency: 1.0                     # 代价地图发布频率 (Hz)
      global_frame: map                          # 全局参考坐标系
      robot_base_frame: base_link                # 机器人基座坐标系
      use_sim_time: false                        # 是否使用仿真时间
      robot_radius: 0.45                         # 机器人半径 (m)
      resolution: 0.05                           # 代价地图分辨率 (m/cell)
      track_unknown_space: true                  # 是否追踪未知空间
      plugins:                                   # 图层插件列表
      - static_layer
      - inflation_layer
      
      # ========================
      # 障碍物层 - 处理传感器数据
      # ========================
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: false                           # 是否启用
        observation_sources: scan                # 观测数据源
        scan:
          topic: /rplidar                        # 激光扫描话题
          sensor_frame: rplidar_frame            # 传感器坐标系
          max_obstacle_height: 2.0               # 最大障碍物高度 (m)
          clearing: true                         # 是否清除自由空间
          marking: true                          # 是否标记障碍物
          data_type: LaserScan                   # 数据类型
          raytrace_max_range: 3.0                # 射线追踪最大范围 (m)
          raytrace_min_range: 0.0                # 射线追踪最小范围 (m)
          obstacle_max_range: 2.5                # 障碍物最大检测范围 (m)
          obstacle_min_range: 0.0                # 障碍物最小检测范围 (m)
      
      # ========================
      # 静态层 - 加载静态地图
      # ========================
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true      # 订阅本地持久化地图
        enabled: true                            # 是否启用
        subscribe_to_updates: true               # 是否订阅更新
        map_topic: /map                          # 地图话题
        trinary_costmap: true                    # 三元代价地图
        lethal_cost_threshold: 50                # 致命成本阈值
      
      # ========================
      # 膨胀层 - 在障碍物周围创建缓冲区
      # ========================
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0                 # 成本缩放因子
        inflation_radius: 0.8                    # 膨胀半径 (m)
        enabled: true                            # 是否启用
      
      always_send_full_costmap: true             # 总是发送完整代价地图
# ========================
# 地图服务器配置
# 用于加载和发布静态地图
# ========================
map_server:
  ros__parameters:
    use_sim_time: false                          # 是否使用仿真时间
    yaml_filename: ''                            # 地图YAML文件路径
# ========================
# 地图保存器配置
# 用于保存生成的地图为图像和YAML文件
# ========================
map_saver:
  ros__parameters:
    use_sim_time: false                          # 是否使用仿真时间
    save_map_timeout: 5.0                        # 保存地图超时时间 (s)
    free_thresh_default: 0.25                    # 自由空间阈值 (0-1, 0表示全黑)
    occupied_thresh_default: 0.65                # 占用空间阈值 (0-1, 1表示全白)
    map_subscribe_transient_local: true          # 订阅本地持久化地图
# ========================
# 路径规划服务器配置
# 计算从机器人位置到目标点的全局路径
# ========================
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0             # 期望的路径规划频率 (Hz)
    use_sim_time: false                          # 是否使用仿真时间
    planner_plugins:                             # 路径规划插件列表
    - GridBased
    
    # ========================
    # 基于栅格的路径规划器 (Navfn)
    # ========================
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5                             # 规划容差 (m)
      use_astar: true                            # 是否使用A*算法 (false=Dijkstra)
      allow_unknown: true                        # 是否允许规划经过未知区域
# ========================
# 平滑器服务器配置
# 对规划的路径进行平滑处理
# ========================
smoother_server:
  ros__parameters:
    use_sim_time: false                          # 是否使用仿真时间
    smoother_plugins:                            # 平滑器插件列表
    - simple_smoother
    
    # ========================
    # 简单平滑器
    # ========================
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10                         # 平滑容差
      max_its: 1000                              # 最大迭代次数
      do_refinement: true                        # 是否进行细化
# ========================
# 行为服务器配置
# 执行导航相关的行为动作
# ========================
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw    # 代价地图话题
    footprint_topic: local_costmap/published_footprint  # 机器人足迹话题
    cycle_frequency: 10.0                        # 行为循环频率 (Hz)
    behavior_plugins:                            # 行为插件列表
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    # ========================
    # 旋转行为
    # ========================
    spin:
      plugin: nav2_behaviors/Spin
    
    # ========================
    # 后退行为
    # ========================
    backup:
      plugin: nav2_behaviors/BackUp
      backup_speed: 0.2                          # 后退速度 (m/s)
      backup_dist: 0.3                           # 后退距离 (m)
    
    # ========================
    # 朝向驱动行为
    # ========================
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    
    # ========================
    # 等待行为
    # ========================
    wait:
      plugin: nav2_behaviors/Wait
    
    # ========================
    # 辅助遥操作行为
    # ========================
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    
    global_frame: odom                           # 全局参考坐标系
    robot_base_frame: base_link                  # 机器人基座坐标系
    transform_timeout: 0.1                       # 变换容差 (s)
    use_sim_time: false                          # 是否使用仿真时间
    simulate_ahead_time: 2.0                     # 前瞻模拟时间 (s)
    max_rotational_vel: 0.8                      # 最大旋转速度 (rad/s)
    min_rotational_vel: 0.3                      # 最小旋转速度 (rad/s)
    rotational_acc_lim: 3.2                      # 旋转加速度限制 (rad/s²)
# ========================
# 机器人状态发布器配置
# 发布机器人的关节状态和TF变换
# ========================
robot_state_publisher:
  ros__parameters:
    use_sim_time: false                          # 是否使用仿真时间
# ========================
# 路点跟随器配置
# 导航到多个连续路点
# ========================
waypoint_follower:
  ros__parameters:
    use_sim_time: false                          # 是否使用仿真时间
    loop_rate: 20                                # 循环频率 (Hz)
    stop_on_failure: false                       # 失败时是否停止
    waypoint_task_executor_plugin: wait_at_waypoint  # 路点执行插件
    
    # ========================
    # 在路点处等待插件
    # ========================
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true                              # 是否启用
      waypoint_pause_duration: 200               # 在路点等待时长 (ms)
# ========================
# 速度平滑器配置
# 对速度命令进行平滑处理以实现平缓运动
# ========================
velocity_smoother:
  ros__parameters:
    use_sim_time: false                          # 是否使用仿真时间
    smoothing_frequency: 20.0                    # 平滑频率 (Hz)
    scale_velocities: false                      # 是否缩放速度
    feedback: OPEN_LOOP                          # 反馈模式 (CLOSED_LOOP 或 OPEN_LOOP)
    max_velocity:                                # 最大速度 [vx, vy, wz] (m/s, m/s, rad/s)
    - 0.5
    - 0.0
    - 0.8
    min_velocity:                                # 最小速度 [vx, vy, wz] (m/s, m/s, rad/s)
    - -0.5
    - 0.0
    - -0.8
    max_accel:                                   # 最大加速度 [ax, ay, az] (m/s², m/s², rad/s²)
    - 2.5
    - 0.0
    - 3.2
    max_decel:                                   # 最大减速度 [ax, ay, az] (m/s², m/s², rad/s²)
    - -2.5
    - 0.0
    - -3.2
    odom_topic: odom                             # 里程计话题
    odom_duration: 0.1                           # 里程计数据有效时长 (s)
    deadband_velocity:                            # 死区速度 [vx, vy, wz] (m/s, m/s, rad/s)
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0                        # 速度超时时长 (s)